
```html
<!DOCTYPE html>
<html lang="en">
<head>
<title>CSS Selector Example</title>
<meta charset="UTF-8">

<style>
* {
    margin: 10px 15px;
}

main {
    border: 3px solid purple;
    padding: 20px;
    background-color: #f3e5f5;
}

h1 {
    font-family: Arial, sans-serif;
    color: darkmagenta;
    text-align: center;
}

p {
    margin-left: 30px;
    font-size: 18px;
}

#copyright {
    font-size: 14px;
    color: gray;
}

.green {
    color: green;
}

.right {
    text-align: right;
}
</style>
</head>

<body>

<main>
    <h1>Upcoming Event Schedule</h1>

    <p class="green">January: Web Development Workshop</p>
    <p class="green">February: Python Programming Seminar</p>
    <p class="green">March: Database Management Session</p>
</main>

<footer>
    <p id="copyright" class="green right">
        Copyright 2026
    </p>
</footer>

</body>
</html>
